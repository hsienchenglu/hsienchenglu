<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<!-- 內建的資料庫網址：填了之後使用者就不必自己輸入，那一格是最容易打錯的。
     留空的話行為照舊，由每個人自己在設定頁填。 -->
<meta name="default-db-url"
      content="https://zhid-talk-default-rtdb.asia-southeast1.firebasedatabase.app">
<meta name="app-version" content="20260829-1211">
<title>譯通 — 中印即時翻譯通話</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="譯通">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ───────────────── 主畫面 ───────────────── -->
<section id="screenMain" class="screen active">
  <header class="topbar topbar-main">
    <!-- 介面語言切換：顯示的是「切過去會變成的語言」 -->
    <button id="btnUiLang" class="lang-btn" data-i18n-title="settings_ui_lang">中</button>
    <!-- 三種語言用「按一下換下一個」講不清楚現在是哪一種，改成跳選單 -->
    <div id="langMenu" class="lang-menu hidden">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="id">Bahasa Indonesia</button>
      <button type="button" data-lang="en">English</button>
    </div>

    <div class="brand">
      <h1 data-i18n="app_name">譯通</h1>
      <!-- 找不到 logo.png 時自動隱藏，不會留下破圖 -->
      <img id="brandLogo" class="brand-logo" src="logo.png" alt="AICOM"
           onerror="this.remove()">
    </div>
    <div id="myAccountLabel" class="sub"></div>
    <div id="myLangLabel" class="sub accent"></div>
    <button id="btnSettings" class="icon-btn" data-i18n-title="settings">⚙</button>
  </header>

  <!-- 待機：連線會自動建立，但鈴聲與通知需要使用者點一下才能授權 -->
  <div id="standbyCard" class="card standby">
    <div>
      <div class="card-title" data-i18n="standby_title">待機狀態</div>
      <div id="standbyState" class="sub"></div>
      <div id="standbyPush" class="sub"></div>
    </div>
    <button id="btnStandby" class="btn primary small" data-i18n="enable_alerts">啟用鈴聲與通知</button>
  </div>

  <!-- 來電卡片 -->
  <div id="incomingCard" class="card incoming hidden">
    <div class="label accent" data-i18n="incoming_call">翻譯通話來電</div>
    <div id="incomingPeer" class="big"></div>
    <div class="row gap">
      <button id="btnReject" class="btn danger-outline grow" data-i18n="reject">拒接</button>
      <button id="btnAccept" class="btn primary grow" data-i18n="accept">接聽</button>
    </div>
  </div>

  <!-- 撥號 -->
  <div class="card">
    <div class="card-title" data-i18n="dial_title">撥打翻譯通話</div>
    <input id="inputPeer" class="input" type="text" data-i18n-ph="peer_hint" autocomplete="off">
    <button id="btnCall" class="btn primary block">📞 <span data-i18n="call_button">撥號</span></button>
    <div id="setupHint" class="hint warn hidden" data-i18n="setup_hint"></div>
  </div>

  <!-- 通話紀錄 -->
  <div class="row between mt">
    <h2 data-i18n="history_title">通話紀錄</h2>
    <button id="btnClearHistory" class="btn text danger hidden" data-i18n="clear_all">全部刪除</button>
  </div>
  <ul id="historyList" class="history"></ul>
  <div id="noHistory" class="hint center" data-i18n="no_history"></div>
</section>

<!-- ───────────────── 通話畫面 ───────────────── -->
<section id="screenCall" class="screen">
  <div class="call-head">
    <div id="callPeer" class="big"></div>
    <div id="callLangPair" class="sub accent"></div>
    <div id="callStatus" class="sub"></div>
    <div id="callDuration" class="sub"></div>
  </div>

  <ul id="transcript" class="transcript"></ul>
  <div id="transcriptEmpty" class="hint center" data-i18n="no_transcript"></div>

  <div id="partial" class="partial hidden"></div>
  <canvas id="wave" class="wave" height="56"></canvas>
  <div id="micHint" class="hint center"></div>

  <div class="controls">
    <button id="btnSpeaker" class="fab mini" data-i18n-title="auto_speak">🔊</button>
    <button id="btnMic" class="fab large" data-i18n-title="mic_off_hint">🎙</button>
    <button id="btnEnd" class="fab danger" data-i18n-title="end_call_q">📵</button>
  </div>
</section>

<!-- ───────────────── 全螢幕來電 ───────────────── -->
<section id="screenIncoming" class="screen incoming-screen">
  <div class="label accent" data-i18n="incoming_call">翻譯通話來電</div>
  <div class="avatar">📞</div>
  <div id="incomingPeerBig" class="huge"></div>
  <div id="incomingLang" class="sub"></div>
  <div class="controls wide">
    <div class="stack">
      <button id="btnRejectBig" class="fab danger big" data-i18n-title="reject">📵</button>
      <span class="sub" data-i18n="reject">拒接</span>
    </div>
    <div class="stack">
      <button id="btnAcceptBig" class="fab primary big" data-i18n-title="accept">📞</button>
      <span class="sub" data-i18n="accept">接聽</span>
    </div>
  </div>
</section>

<!-- ───────────────── 逐字稿 ───────────────── -->
<section id="screenDetail" class="screen">
  <header class="topbar">
    <button id="btnDetailBack" class="icon-btn" data-i18n-title="back">←</button>
    <h1 id="detailTitle"></h1>
    <span></span>
  </header>
  <ul id="detailTranscript" class="transcript"></ul>
  <div id="detailEmpty" class="hint center hidden" data-i18n="no_transcript"></div>
  <button id="btnDeleteRecord" class="btn danger-outline block mt">
    🗑 <span data-i18n="delete_record">刪除這筆紀錄</span>
  </button>
</section>

<!-- ───────────────── 設定 ───────────────── -->
<section id="screenSettings" class="screen">
  <header class="topbar">
    <button id="btnSettingsBack" class="icon-btn" data-i18n-title="back">←</button>
    <h1 data-i18n="settings">設定</h1>
    <span></span>
  </header>

  <div class="card">
    <div class="card-title" data-i18n="settings_ui_lang">介面語言</div>
    <div class="hint" data-i18n="settings_ui_lang_desc"></div>
    <div class="row gap wrap">
      <label class="radio"><input type="radio" name="uilang" value="zh"> 中文</label>
      <label class="radio"><input type="radio" name="uilang" value="id"> Bahasa Indonesia</label>
      <label class="radio"><input type="radio" name="uilang" value="en"> English</label>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="settings_account">帳號</div>
    <div class="hint" data-i18n="settings_account_desc"></div>
    <input id="setAccount" class="input" type="text" data-i18n-ph="my_account_hint" autocomplete="off">
    <input id="setPeer" class="input" type="text" data-i18n-ph="peer_account_hint" autocomplete="off">
  </div>

  <div class="card">
    <div class="card-title" data-i18n="settings_lang">我說的語言</div>
    <div class="hint" data-i18n="settings_lang_desc"></div>
    <div class="row gap wrap">
      <label class="radio"><input type="radio" name="lang" value="zh"> <span data-i18n="lang_zh">中文</span></label>
      <label class="radio"><input type="radio" name="lang" value="id"> <span data-i18n="lang_id">印尼文</span></label>
      <label class="radio"><input type="radio" name="lang" value="en"> <span data-i18n="lang_en">英文</span></label>
    </div>
    <!-- 對方的話會用這個語言唸出來，先在這裡確認手機唸得出來 -->
    <div class="row between">
      <span class="hint" data-i18n="tts_test_desc"></span>
      <button id="btnTestVoice" class="btn text" data-i18n="tts_test">試唸</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title" data-i18n="settings_db">連線</div>
    <div class="hint" data-i18n="settings_db_desc"></div>
    <input id="setDbUrl" class="input" type="url" data-i18n-ph="db_url_hint">
    <input id="setDbSecret" class="input" type="text" data-i18n-ph="db_secret_hint" autocomplete="off">
  </div>

  <div class="card">
    <div class="card-title" data-i18n="settings_translate">翻譯服務</div>
    <div class="hint" data-i18n="settings_translate_desc"></div>
    <div class="row gap">
      <label class="radio"><input type="radio" name="provider" value="google"> Google</label>
      <label class="radio"><input type="radio" name="provider" value="gemini"> Gemini</label>
      <label class="radio"><input type="radio" name="provider" value="openai"> OpenAI</label>
    </div>
    <input id="setApiKey" class="input" type="password" data-i18n-ph="api_key_hint" autocomplete="off">
  </div>

  <div class="card">
    <div class="card-title" data-i18n="settings_ring">來電鈴聲</div>
    <div class="hint" data-i18n="settings_ring_desc"></div>
    <div class="row between">
      <span id="ringLabel" class="accent"></span>
      <button id="btnTestRing" class="btn text" data-i18n="ring_test">試聽</button>
    </div>
    <input id="setRing" class="slider" type="range" min="1" max="5" step="1" value="2">
    <label class="check"><input id="setAutoListen" type="checkbox"> <span data-i18n="auto_listen">通話中自動聆聽</span></label>
    <label class="check"><input id="setAutoSpeak" type="checkbox"> <span data-i18n="auto_speak">自動朗讀對方的話</span></label>
    <!-- 用伺服器產生的聲音，手機沒裝語音資料也唸得出來 -->
    <label class="check"><input id="setServerTts" type="checkbox"> <span data-i18n="server_tts">用網路語音朗讀（比較自然）</span></label>
    <div class="hint" data-i18n="server_tts_desc"></div>
  </div>

  <button id="btnTest" class="btn outline block" data-i18n="test_connection">測試連線與翻譯</button>
  <div id="testResult" class="hint"></div>

  <button id="btnReset" class="btn outline block" data-i18n="reset_state">清除殘留的通話狀態</button>
  <div class="hint" data-i18n="reset_state_desc"></div>

  <button id="btnSave" class="btn primary block mt" data-i18n="save">儲存</button>
  <div class="hint center" data-i18n="browser_note"></div>
  <!-- 出問題時第一件要問的就是「你現在是哪一版」，直接顯示出來 -->
  <div id="versionLabel" class="hint center mb"></div>
</section>

<!-- 偵測到新版本時才出現，整條都可以點 -->
<button id="updateBar" class="update-bar hidden" data-i18n="update_prompt"></button>

<div id="toast" class="toast"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
