# 這個資料夾本身就是網站根目錄：
# 用 GitHub 連結部署時，把 base directory 設成 web；
# 用拖曳上傳時，直接把 web 資料夾丟進 Netlify 即可。
[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker 不能被快取，否則使用者會一直停在舊版
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 版本戳記與首頁都不能被快取，否則「有新版本」永遠比對不出來，
# 或是按了更新之後又載到同一份舊的 HTML
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
