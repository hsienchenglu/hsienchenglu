# 從 repo 根目錄部署時使用的設定。
# 若在 Netlify 後台把 base directory 設成 web，則會改用 web/netlify.toml。
[build]
  publish = "web"
  functions = "web/netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Service Worker 不能被快取，否則使用者會一直停在舊版
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 版本戳記與首頁都不能被快取，否則「有新版本」永遠比對不出來，
# 或是按了更新之後又載到同一份舊的 HTML
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
